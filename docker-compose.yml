services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lot_user
      POSTGRES_PASSWORD: lot_pass
      POSTGRES_DB: lot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lot_user:lot_pass@db:5432/lot_db
    depends_on:
      - db

volumes:
  postgres_data: